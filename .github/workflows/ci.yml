name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests (unit, integration, security)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t quarry-api ./backend
          docker build -f frontend/Dockerfile -t quarry-web .
      - name: Smoke test the stack
        env:
          POSTGRES_PASSWORD: ci-postgres-pass
          REDIS_PASSWORD: ci-redis-pass
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0123456789
          DATA_ENCRYPTION_KEYS: ${{ secrets.CI_FERNET_KEY || 'cXVhcnJ5LWNpLWtleS0zMi1ieXRlcy1sb25nLW9rISE=' }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: not-used-in-smoke-test
          COOKIE_SECURE: "true"
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/nginx-health
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/datasets)" = "401"
          docker compose ps
      - if: always()
        run: docker compose logs --tail=100
