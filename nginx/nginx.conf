# Edge proxy: serves the SPA, load-balances the API replicas, and enforces
# coarse per-IP limits before traffic reaches Python. Fine-grained, per-user
# limits live in the app (Redis-backed) because only the app knows the user.

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                '"rt":$request_time,"upstream":"$upstream_addr","urt":"$upstream_response_time",'
                                '"rid":"$request_id"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv text/markdown;
    gzip_min_length 1024;

    # ---- abuse limits (per client IP) ----
    limit_req_zone  $binary_remote_addr zone=api:20m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=ask:10m   rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Docker's embedded DNS. `resolve` re-reads the replica IPs as containers
    # scale up/down, so `docker compose up --scale api=N` needs no nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_pool {
        zone api_pool 64k;
        least_conn;                     # SSE streams are long; balance by open connections, not round robin
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;                   # reuse upstream connections
    }

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        client_max_body_size 30m;       # app enforces 25 MB per file; this stops floods earlier
        client_body_timeout 30s;
        limit_conn perip 40;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Enable once TLS terminates in front of this proxy:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        # Internal-only endpoints are never exposed through the edge.
        location ~ ^/(metrics|readyz|healthz)$ { return 404; }

        # Credential endpoints only: brute-force protection at the edge (the app adds per-account lockout).
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/proxy_common.conf;
        }

        location ~ ^/api/conversations/[^/]+/ask$ {
            limit_req zone=ask burst=5 nodelay;
            include /etc/nginx/proxy_common.conf;
            proxy_buffering off;        # stream Server-Sent Events as they are produced
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy_common.conf;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            try_files $uri /index.html;
        }
    }
}
