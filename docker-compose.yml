# Production-like local stack:
#   browser -> web (nginx: SPA + load balancer + edge limits) -> api x3 (gunicorn/uvicorn)
#                                                              -> postgres, redis (private network)
# Scale the API with: docker compose up -d --scale api=5

name: quarry

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+psycopg://quarry:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/quarry
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  STORAGE_DIR: /data/blobs
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?set DATA_ENCRYPTION_KEYS in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  CORS_ORIGINS: ""
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quarry
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarry -d quarry"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    restart: unless-stopped

  # One-shot: apply database migrations before any API replica starts, so
  # replicas never race each other on schema changes.
  migrate:
    build: ./backend
    image: quarry-api:latest
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    image: quarry-api:latest
    environment: *api-env
    volumes: [blobs:/data/blobs]   # shared by all replicas; files are encrypted at rest
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.0", memory: 1g }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [app, data]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]
    networks: [app]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    networks: [app]

volumes:
  pgdata:
  blobs:

networks:
  app:
  data:
    internal: true   # postgres and redis are unreachable from outside, and have no internet access
